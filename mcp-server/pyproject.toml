[project]
name = "financial-mcp"
version = "1.0.0"
description = "MCP server providing financial data tools via Yahoo Finance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcade-mcp>=0.1.0",
    "yfinance>=0.2.49",
    "python-dotenv>=1.0.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/financial_mcp"]
